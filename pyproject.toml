[project]
name = "vifinrag"
version = "0.1.0"
description = "Multimodal Retrieval-Augmented Generation for Vietnamese Financial Reports: Benchmark and Comparative Study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "tenacity>=8.3.0",
    "pymupdf>=1.24.0",
    "pdf2image>=1.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
