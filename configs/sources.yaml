# configs/sources.yaml
# Cấu hình nguồn dữ liệu và danh sách công ty thu thập BCTN / BCTC
# Tuân thủ quy tắc trong CLAUDE.md & README.md
#
# QUAN TRỌNG trước khi crawl:
#   1. Điền email thật vào user_agent (thay <EMAIL_CUA_BAN>).
#   2. Mở trình duyệt kiểm tra từng ir_url, đặt ir_url_verified: true khi xác nhận URL hợp lệ.

# ---------------------------------------------------------------------------
# Cài đặt crawler
# ---------------------------------------------------------------------------
crawler_settings:
  user_agent: "ViFinRAG/1.0 (Academic Research; contact: nhan.nd235182@sis.hust.edu.vn)"
  request_delay_seconds: 1.5      # Giới hạn 1-2 giây mỗi request mỗi domain
  timeout_seconds: 30
  max_retries: 3
  backoff_factor: 2.0
  max_concurrent: 1               # Số domain tải song song; giữ ở 1 khi chưa kiểm tra kỹ
  respect_robots: true            # Tự động đọc robots.txt và tuân thủ Disallow
  download_dir: "data/raw/pdf"
  metadata_path: "data/metadata.csv"
  crawl_log_path: "data/crawl_log.csv"

# ---------------------------------------------------------------------------
# Tài liệu mục tiêu
# ---------------------------------------------------------------------------
target_document_types:
  - BCTN   # Báo cáo thường niên (Annual Report)
  - BCTC   # Báo cáo tài chính đã kiểm toán năm (Audited Financial Statements)

# Cập nhật: 2023-2025 (hiện là 10/2026, BCTN 2025 nhiều công ty đã công bố)
# Trước khi crawl năm 2025, xác nhận báo cáo thực sự đã có trên trang nguồn
target_years:
  - 2023
  - 2024
  - 2025

# ---------------------------------------------------------------------------
# Danh sách ngành chuẩn (12 giá trị cố định - KHÔNG thêm giá trị ngoài danh sách này)
# Dùng đúng nhãn này cho trường `industry` của từng công ty để lấy mẫu phân tầng sau này
# ---------------------------------------------------------------------------
industry_taxonomy:
  - "Ngân hàng"
  - "Bảo hiểm"
  - "Chứng khoán"
  - "Công nghệ thông tin"
  - "Bán lẻ & Tiêu dùng"
  - "Thực phẩm & Đồ uống"
  - "Thép & Kim loại"
  - "Hóa chất & Phân bón"
  - "Bất động sản"
  - "Năng lượng & Dầu khí"
  - "Logistics & Cảng biển"
  - "Dược phẩm & Y tế"
  - "Thủy sản"
  - "Dệt may & May mặc"
  - "Vật liệu xây dựng"
  - "Hàng không & Vận tải"

# ---------------------------------------------------------------------------
# Nguồn trung gian / tổng hợp (kiểm tra trước khi dùng làm nguồn tải)
# ---------------------------------------------------------------------------
aggregated_sources:
  hose:
    name: "Sở Giao dịch Chứng khoán TP.HCM (HOSE)"
    base_url: "https://www.hsx.vn"
    notes: ""
  hnx:
    name: "Sở Giao dịch Chứng khoán Hà Nội (HNX)"
    base_url: "https://hnx.vn"
    notes: ""
  cafef:
    name: "CafeF"
    base_url: "https://cafef.vn"
    notes: ""
  vietstock:
    name: "Vietstock"
    base_url: "https://vietstock.vn"
    notes: ""

